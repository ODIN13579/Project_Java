openapi: 3.0.3
info:
  title: SwiftletCare REST API — DSN-09
  version: 0.9.0-review
  description: Draft specification for SwiftletCare Java Spring Boot BUILD. REST responses use camelCase; MQTT uses event_id.
    This contract separates confirmed architecture choices from proposed API route/design decisions.
    Heartbeat/Telemetry from ESP32 are MQTT, not public REST endpoints.
servers:
- url: http://localhost:8080
  description: Local Spring Boot BUILD demo; production host TBD
tags:
- name: Authentication
- name: Users
- name: Houses
- name: Memberships
- name: Zones
- name: Devices
- name: Actuators
- name: Telemetry
- name: Zone Configuration
- name: Control Commands
- name: AI Events
- name: Alerts
- name: Notifications
- name: Harvest
- name: Statistics & Reports
- name: Dashboard
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      summary: Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []
      x-build-priority: MVP
      x-requirement-group: FR-USER/RBAC
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      operationId: refreshToken
      summary: Làm mới JWT
      description: Refresh token policy appears in DSN-05; endpoint should be reviewed with P4 before implementation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []
      x-build-priority: Extended
      x-requirement-group: FR-USER/RBAC
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      operationId: logout
      summary: Thu hồi refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: Extended
      x-requirement-group: FR-USER/RBAC
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
  /api/v1/users/me:
    get:
      tags:
      - Users
      operationId: getMyProfile
      summary: Xem hồ sơ cá nhân
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: MVP
      x-requirement-group: FR-USER
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
    patch:
      tags:
      - Users
      operationId: updateMyProfile
      summary: Cập nhật hồ sơ cá nhân
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: Extended
      x-requirement-group: FR-USER
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
  /api/v1/houses:
    get:
      tags:
      - Houses
      operationId: listMyHouses
      summary: Nhà yến được phép truy cập
      parameters:
      - &id001
        name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
        description: 0-based; default 0
      - &id002
        name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
        description: default 20, maximum 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: MVP
      x-requirement-group: FR-FARM/RBAC
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
    post:
      tags:
      - Houses
      operationId: createHouse
      summary: Tạo nhà yến và Zone đầu tiên
      description: Proposed initialZone atomic creation to satisfy House 1..* Zone on Class Diagram; pending approval.
        Restrict by global role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: MVP
      x-requirement-group: FR-FARM/ZONE
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
  /api/v1/houses/{houseId}:
    get:
      tags:
      - Houses
      operationId: getHouse
      summary: Chi tiết nhà yến
      parameters:
      - name: houseId
        in: path
        required: true
        description: Resource identifier
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: MVP
      x-requirement-group: FR-FARM
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
    patch:
      tags:
      - Houses
      operationId: updateHouse
      summary: Sửa nhà yến
      parameters:
      - name: houseId
        in: path
        required: true
        description: Resource identifier
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseUpdateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: Extended
      x-requirement-group: FR-FARM
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
  /api/v1/houses/{houseId}/members:
    get:
      tags:
      - Memberships
      operationId: listHouseMembers
      summary: Danh sách thành viên nhà yến
      parameters:
      - name: houseId
        in: path
        required: true
        description: Resource identifier
        schema:
          type: integer
          format: int64
      - *id001
      - *id002
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: Extended
      x-requirement-group: FR-RBAC
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
    post:
      tags:
      - Memberships
      operationId: addHouseMember
      summary: Thêm thành viên nhà yến
      parameters:
      - name: houseId
        in: path
        required: true
        description: Resource identifier
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseMembershipResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: Extended
      x-requirement-group: FR-RBAC
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
  /api/v1/houses/{houseId}/members/{membershipId}:
    patch:
      tags:
      - Memberships
      operationId: updateHouseMember
      summary: Cập nhật quyền thành viên
      parameters:
      - name: houseId
        in: path
        required: true
        description: Resource identifier
        schema:
          type: integer
          format: int64
      - name: membershipId
        in: path
        required: true
        description: Resource identifier
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipUpdateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseMembershipResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: Extended
      x-requirement-group: FR-RBAC
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
  /api/v1/houses/{houseId}/zones:
    get:
      tags:
      - Zones
      operationId: listHouseZones
      summary: Liệt kê khu vực trong nhà yến
      parameters:
      - name: houseId
        in: path
        required: true
        description: Resource identifier
        schema:
          type: integer
          format: int64
      - *id001
      - *id002
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: MVP
      x-requirement-group: FR-ZONE
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
    post:
      tags:
      - Zones
      operationId: createZone
      summary: Tạo khu vực
      parameters:
      - name: houseId
        in: path
        required: true
        description: Resource identifier
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: MVP
      x-requirement-group: FR-ZONE
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
  /api/v1/zones/{zoneId}:
    get:
      tags:
      - Zones
      operationId: getZone
      summary: Xem chi tiết khu vực
      parameters:
      - name: zoneId
        in: path
        required: true
        description: Resource identifier
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: MVP
      x-requirement-group: FR-ZONE
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
    patch:
      tags:
      - Zones
      operationId: updateZone
      summary: Cập nhật khu vực
      parameters:
      - name: zoneId
        in: path
        required: true
        description: Resource identifier
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneUpdateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: Extended
      x-requirement-group: FR-ZONE
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
  /api/v1/zones/{zoneId}/devices:
    get:
      tags:
      - Devices
      operationId: listZoneDevices
      summary: Thiết bị theo khu vực
      parameters:
      - name: zoneId
        in: path
        required: true
        description: Resource identifier
        schema:
          type: integer
          format: int64
      - *id001
      - *id002
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: MVP
      x-requirement-group: FR-DEVICE
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
    post:
      tags:
      - Devices
      operationId: registerDevice
      summary: Đăng ký thiết bị cho Zone
      description: Device is fixed to one zone in v1; no move endpoint. Device credentials provisioned separately (TBD).
      parameters:
      - name: zoneId
        in: path
        required: true
        description: Resource identifier
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: MVP
      x-requirement-group: FR-DEVICE
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
  /api/v1/devices/{deviceId}:
    get:
      tags:
      - Devices
      operationId: getDevice
      summary: Chi tiết, Online/Offline của thiết bị
      description: deviceId path is internal numeric devices.id, not string devices.device_id in MQTT.
      parameters:
      - name: deviceId
        in: path
        required: true
        description: Resource identifier
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: MVP
      x-requirement-group: FR-DEVICE/IOT
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
    patch:
      tags:
      - Devices
      operationId: updateDevice
      summary: Đổi tên/bật trạng thái quản lý
      parameters:
      - name: deviceId
        in: path
        required: true
        description: Resource identifier
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: Extended
      x-requirement-group: FR-DEVICE
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
  /api/v1/devices/{deviceId}/actuators:
    get:
      tags:
      - Actuators
      operationId: listDeviceActuators
      summary: Các actuator của ESP32
      parameters:
      - name: deviceId
        in: path
        required: true
        description: Resource identifier
        schema:
          type: integer
          format: int64
      - *id001
      - *id002
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActuatorListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-build-priority: MVP
      x-requirement-group: FR-IOT
      x-api-spec-status: PROPOSED_NEEDS_REVIEW
      description: Design endpoint for BUILD, subject to validation, authorization and cross-review as documented in
        DSN-09.
  /api/v1/devices/{deviceId}/telemetry/latest:
    get:
      tags:
      - Telemetry
      operationId: getLatestTelemetry
      summary: Mẫu đo mới nhất của thiết bị
      description: Latest by measurement timestamp DESC then receivedAt DESC, not most recently replayed buffer arrival.
      parameters:
      - name: deviceId
        in: path
        required: true
        description: Resource identifier
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'
              example:
                id: 105
