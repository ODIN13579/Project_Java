components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    aiServiceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: Proposed internal AI service credential; P2/P4 must approve auth mechanism.
  schemas:
    RoleName:
      type: string
      enum:
      - OWNER
      - ADMIN
    HouseRole:
      type: string
      enum:
      - OWNER
      - ADMIN
      - VIEWER
    DeviceType:
      type: string
      enum:
      - ESP32
      - CAMERA
    ActuatorKind:
      type: string
      enum:
      - MIST
      - FAN
      - HEATER
      - AMPLIFIER
    ControlMode:
      type: string
      enum:
      - AUTO
      - MANUAL
    CommandAction:
      type: string
      enum:
      - SET_MODE
      - SET_STATE
    CommandStatus:
      type: string
      enum:
      - PENDING
      - SENT
      - ACKNOWLEDGED
      - FAILED
      - REJECTED
      - EXPIRED
    SensorStatus:
      type: string
      enum:
      - OK
      - PARTIAL_ERROR
      - ERROR
    AlertLevel:
      type: string
      enum:
      - WARNING
      - CRITICAL
    AlertStatus:
      type: string
      enum:
      - NEW
      - IN_PROGRESS
      - RESOLVED
    NotificationChannel:
      type: string
      enum:
      - WEB
      - PUSH
    DeliveryStatus:
      type: string
      enum:
      - PENDING
      - SENT
      - DELIVERED
      - FAILED
    AggregationType:
      type: string
      enum:
      - HOURLY
      - DAILY
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
            additionalProperties: false
      required:
      - code
      - message
      - timestamp
      description: Error representation, fieldErrors optional.
      additionalProperties: false
    PageInfo:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
      required:
      - page
      - size
      - totalElements
      - totalPages
      additionalProperties: false
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/RoleName'
        active:
          type: boolean
      required:
      - id
      - email
      - fullName
      - role
      - active
      additionalProperties: false
    UserUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 30
          nullable: true
      description: At least one field required by service validation.
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
      additionalProperties: false
    TokenPairResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresInSec:
          type: integer
          format: int32
          minimum: 1
      required:
      - accessToken
      - tokenType
      - expiresInSec
      description: Refresh token policy to be approved by P4.
      additionalProperties: false
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
      - refreshToken
      additionalProperties: false
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
      - refreshToken
      additionalProperties: false
    ZoneCreateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        floorLabel:
          type: string
          nullable: true
        areaM2:
          type: number
          format: double
          nullable: true
          minimum: 0
      required:
      - name
      additionalProperties: false
    HouseCreateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        address:
          type: string
        description:
          type: string
          nullable: true
        initialZone:
          $ref: '#/components/schemas/ZoneCreateRequest'
      required:
      - name
      - address
      - initialZone
      description: Proposed atomic House + first Zone creation to satisfy UML House 1..* Zone; pending P3/P4 approval.
      additionalProperties: false
    HouseUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        address:
          type: string
        description:
          type: string
          nullable: true
        active:
          type: boolean
      additionalProperties: false
    HouseResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
        description:
          type: string
          nullable: true
        active:
          type: boolean
      required:
      - id
      - name
      - active
      additionalProperties: false
    ZoneResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        houseId:
          type: integer
          format: int64
        name:
          type: string
        floorLabel:
          type: string
          nullable: true
        areaM2:
          type: number
          format: double
          nullable: true
        active:
          type: boolean
      required:
      - id
      - houseId
      - name
      - active
      additionalProperties: false
    ZoneUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        floorLabel:
          type: string
          nullable: true
        areaM2:
          type: number
          format: double
          nullable: true
          minimum: 0
        active:
          type: boolean
