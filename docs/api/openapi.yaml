          type: boolean
        manualUntil:
          type: string
          nullable: true
          format: date-time
      required:
      - id
      - deviceId
      - kind
      - mode
      - 'on'
      additionalProperties: false
    TelemetryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        deviceId:
          type: integer
          format: int64
        eventId:
          type: string
        timestamp:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        temperature:
          type: number
          format: double
          nullable: true
        humidity:
          type: number
          format: double
          nullable: true
        co2:
          type: number
          format: double
          nullable: true
        light:
          type: number
          format: double
          nullable: true
        sensorStatus:
          $ref: '#/components/schemas/SensorStatus'
      required:
      - id
      - deviceId
      - eventId
      - timestamp
      - receivedAt
      - sensorStatus
      description: REST camelCase eventId maps MQTT event_id and DB event_id. Null measurements are invalid sensor readings,
        not zero.
      additionalProperties: false
    ZoneConfigUpsertRequest:
      type: object
      properties:
        humidityOn:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
        humidityOff:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
        tempMin:
          type: number
          format: double
          nullable: true
        tempMax:
          type: number
          format: double
          nullable: true
        tempHysteresis:
          type: number
          format: double
          nullable: true
          minimum: 0
        co2Min:
          type: number
          format: double
          nullable: true
          minimum: 0
        co2Max:
          type: number
          format: double
          nullable: true
          minimum: 0
        lightMin:
          type: number
          format: double
          nullable: true
          minimum: 0
        lightMax:
          type: number
          format: double
          nullable: true
          minimum: 0
        telemetryIntervalSec:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
        heartbeatIntervalSec:
          type: integer
          format: int32
          minimum: 1
          enum:
          - 2
          description: BUILD baseline heartbeat interval fixed at 2s to meet 6s timeout; revisiting requires revising
            backend timeout.
        version:
          type: integer
          format: int32
          minimum: 0
      required:
      - telemetryIntervalSec
      - heartbeatIntervalSec
      - version
      description: Must validate hysteresis and optimistic version; heartbeat 2s is currently agreed baseline. For BUILD
        heartbeatIntervalSec must equal 2 until timeout policy is revised.
      additionalProperties: false
    ZoneConfigResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        zoneId:
          type: integer
          format: int64
        humidityOn:
          type: number
          format: double
          nullable: true
        humidityOff:
          type: number
          format: double
          nullable: true
        tempMin:
          type: number
          format: double
          nullable: true
        tempMax:
          type: number
          format: double
          nullable: true
        tempHysteresis:
          type: number
          format: double
          nullable: true
        co2Min:
          type: number
          format: double
          nullable: true
        co2Max:
          type: number
          format: double
          nullable: true
        lightMin:
          type: number
          format: double
          nullable: true
        lightMax:
          type: number
          format: double
          nullable: true
        telemetryIntervalSec:
          type: integer
          format: int32
