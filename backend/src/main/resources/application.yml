spring:
  application:
    name: swiftletcare-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/swiftletcare}
    username: ${DB_USERNAME:swiftletcare}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: swiftletcare
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    default-schema: public
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
